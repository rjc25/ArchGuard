name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/bundle-cli.mjs

      # Build a self-contained zip/tar.gz with:
      #   - snoutguard.cjs (bundled CLI)
      #   - node_modules/better-sqlite3 (native addon, compiled for this platform)
      #   - node/node[.exe] (bundled Node.js runtime, so users don't need Node installed)
      #   - snoutguard[.cmd] (launcher script that references the bundled node)
      - name: Create distribution package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          DIST_DIR="snoutguard-dist"
          mkdir -p "$DIST_DIR/node"

          # 1. Copy the bundled CLI
          cp packages/cli/dist/snoutguard.cjs "$DIST_DIR/"

          # 2. Install better-sqlite3 native addon for this platform.
          #    node-pre-gyp/prebuild-install will download a prebuilt binary
          #    for the current platform/arch/Node ABI — no compilation needed.
          node -e "const fs=require('fs');fs.writeFileSync('$DIST_DIR/package.json',JSON.stringify({name:'snoutguard-dist',private:true,dependencies:{'better-sqlite3':'^11.7.0'}},null,2));"
          cd "$DIST_DIR"
          npm install --omit=dev
          cd ..
          # Remove npm artifacts not needed at runtime
          rm -f "$DIST_DIR/package.json" "$DIST_DIR/package-lock.json"

          # 3. Bundle the Node.js runtime binary (same version as what compiled better-sqlite3,
          #    so the native ABI matches)
          NODE_BIN=$(which node)
          if [ -f "${NODE_BIN}.exe" ]; then
            cp "${NODE_BIN}.exe" "$DIST_DIR/node/node.exe"
          else
            cp "$NODE_BIN" "$DIST_DIR/node/node"
            chmod +x "$DIST_DIR/node/node"
          fi

          # 4. Create launcher and archive
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            # Windows CMD launcher — %~dp0 gives the batch file's directory at runtime,
            # so paths are always correct regardless of working directory.
            # Must use CRLF line endings for .cmd files.
            printf '@echo off\r\n"%~dp0node\\node.exe" "%~dp0snoutguard.cjs" %%*\r\n' > "$DIST_DIR/snoutguard.cmd"

            # Package as zip (7-Zip is pre-installed on windows-latest GH Actions runners)
            cd "$DIST_DIR"
            7z a "../snoutguard-${VERSION}-win-x64.zip" .
            cd ..
            echo "Created snoutguard-${VERSION}-win-x64.zip"
          else
            # Linux shell launcher — uses $(dirname "$0") so it works from any working dir
            printf '#!/bin/sh\nSCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$SCRIPT_DIR/node/node" "$SCRIPT_DIR/snoutguard.cjs" "$@"\n' > "$DIST_DIR/snoutguard"
            chmod +x "$DIST_DIR/snoutguard"

            # Package as tar.gz
            tar -czf "snoutguard-${VERSION}-linux-x64.tar.gz" -C "$DIST_DIR" .
            echo "Created snoutguard-${VERSION}-linux-x64.tar.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoutguard-${{ matrix.target }}
          path: |
            snoutguard-*.zip
            snoutguard-*.tar.gz

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/bundle-cli.mjs

      - name: Prepare npm package
        run: |
          mkdir -p .publish/dist
          cp packages/cli/dist/snoutguard.cjs .publish/dist/
          cp packages/cli/package.npm.json .publish/package.json
          cp README.md .publish/
          cp LICENSE .publish/

      - name: Publish to npm
        run: |
          cd .publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: snoutguard-linux-x64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: snoutguard-win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            snoutguard-*.tar.gz
            snoutguard-*.zip
