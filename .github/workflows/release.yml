name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/bundle-cli.mjs

      # Copy better-sqlite3 + runtime deps from pnpm store into a flat node_modules/.
      # Uses Node.js fs.cpSync (handles NTFS junctions on Windows correctly).
      - name: Copy native dependencies
        run: node scripts/copy-native-deps.mjs snoutguard-dist

      # Assemble distribution archive:
      #   snoutguard-dist/
      #     snoutguard.cjs          (bundled CLI)
      #     node_modules/           (better-sqlite3 + bindings + file-uri-to-path)
      #     node/node[.exe]         (bundled Node.js 22 runtime)
      #     snoutguard[.cmd]        (launcher)
      - name: Create distribution archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          DIST="snoutguard-dist"

          # Copy bundled CLI
          cp packages/cli/dist/snoutguard.cjs "$DIST/"

          # Bundle the Node.js runtime (same version that compiled better-sqlite3 → ABI match)
          mkdir -p "$DIST/node"
          NODE_BIN="$(node -e "process.stdout.write(process.execPath)")"
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            cp "$NODE_BIN" "$DIST/node/node.exe"
          else
            cp "$NODE_BIN" "$DIST/node/node"
            chmod +x "$DIST/node/node"
          fi

          # Create platform launcher + archive
          if [[ "${{ matrix.target }}" == "win-x64" ]]; then
            # CMD launcher with CRLF line endings
            printf '@echo off\r\n"%%~dp0node\\node.exe" "%%~dp0snoutguard.cjs" %%*\r\n' > "$DIST/snoutguard.cmd"
            cd "$DIST" && 7z a -r "../snoutguard-${VERSION}-win-x64.zip" . && cd ..
          else
            printf '#!/bin/sh\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexec "$DIR/node/node" "$DIR/snoutguard.cjs" "$@"\n' > "$DIST/snoutguard"
            chmod +x "$DIST/snoutguard"
            tar -czf "snoutguard-${VERSION}-linux-x64.tar.gz" -C "$DIST" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snoutguard-${{ matrix.target }}
          path: |
            snoutguard-*.zip
            snoutguard-*.tar.gz

  publish-npm:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/bundle-cli.mjs

      - name: Prepare npm package
        run: |
          mkdir -p .publish/dist
          cp packages/cli/dist/snoutguard.cjs .publish/dist/
          cp packages/cli/package.npm.json .publish/package.json
          cp README.md .publish/
          cp LICENSE .publish/

      - name: Publish to npm
        run: |
          cd .publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: snoutguard-linux-x64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: snoutguard-win-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            snoutguard-*.tar.gz
            snoutguard-*.zip
